# AI SENSE Free Public Tools: a vendor-hosted remote MCP server over Streamable
# HTTP with no authentication. Run by AI SENSE AS, Oslo. Documentation:
# https://aisense.no/free-public-mcp-server and the repository
# https://github.com/aisenseapi/aisense-free-public-rest-apis (MCP.md).
# Listed in the official MCP registry as com.aisenseapi/free-public-tools.
manifest_version: 1
name: aisense
description: Free utility and agent workflow tools with no account or key - time, hashing, QR codes, PDF, temporary storage, webhook capture, queues, leases, decisions
source: https://aisense.no/free-public-mcp-server
transport:
  type: http
  url: https://aisenseapi.com/mcp
auth:
  type: none
suggest:
  keywords:
    - aisense
    - webhook capture
    - qr code
    - html to pdf
    - agent queue
    - decide
  hosts:
    - aisense.no
    - aisenseapi.com
post_install: |
  No account or credentials are needed. Every address has 5000 requests a day
  across all tools, and the server issues no session ID. Tools that create
  something (queues, inboxes, captures, leases, secrets) answer bearer tokens;
  keep them out of logs and messages. Temporary storage and captures expire
  after 24 hours and must never carry secrets or personal data.
